<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cute Card 💖</title>
  <style>
    :root{
      --bg1:#ffeef8; --bg2:#fff8e7;
      --card:#ffffffcc; --accent:#ff6b9a;
      --shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    /* Page */
    html,body{
      height:100%;
      margin:0;
      font-family: "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial;
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Cute card */
    .card{
      width:320px;
      padding:28px;
      border-radius:18px;
      background:var(--card);
      box-shadow:var(--shadow);
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    h1{ margin:0 0 6px; font-size:22px; letter-spacing:0.4px; }
    p{ margin:0 0 18px; color:#555; font-size:14px; line-height:1.35; }

    /* Button */
    .btn{
      display:inline-block;
      border:0;
      padding:10px 16px;
      border-radius:12px;
      background:linear-gradient(90deg,#ff9bb8,#ff6b9a);
      color:white;
      font-weight:600;
      cursor:pointer;
      box-shadow: 0 6px 14px rgba(255,107,154,0.25);
      transform: translateY(0);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn:active{ transform: translateY(2px); box-shadow: 0 4px 10px rgba(255,107,154,0.18); }

    /* Floating hearts (pure CSS) */
    .hearts{
      position:absolute;
      inset:0;
      pointer-events:none;
    }
    .heart{
      --size:18px;
      position:absolute;
      width:var(--size);
      height:var(--size);
      transform:translate(-50%,-50%) rotate(45deg) scale(.9);
      opacity:.9;
      animation: floatUp linear infinite;
    }
    .heart::before, .heart::after{
      content:"";
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      background:var(--accent);
    }
    .heart::before{ top:-50%; left:0; }
    .heart::after{ left:50%; top:0; }

    /* Different timing & positions */
    .h1{ left:20%; bottom:10%; animation-duration:6s; animation-delay:0s; --size:16px; opacity:.8;}
    .h2{ left:40%; bottom:0%; animation-duration:7s; animation-delay:1s; --size:20px; opacity:.9;}
    .h3{ left:70%; bottom:5%; animation-duration:5.5s; animation-delay:.5s; --size:14px; opacity:.85;}
    .h4{ left:85%; bottom:12%; animation-duration:8s; animation-delay:1.5s; --size:10px; opacity:.7;}
    .h5{ left:10%; bottom:30%; animation-duration:9s; animation-delay:2s; --size:12px; opacity:.7;}

    @keyframes floatUp{
      0%{ transform: translate(-50%, 20px) rotate(45deg) scale(.8); opacity:0; }
      10%{ opacity:0.9; }
      100%{ transform: translate(-50%, -120%) rotate(45deg) scale(1.05); opacity:0; }
    }

    /* Burst effect when active */
    .burst .heart{
      animation-name: burst;
      animation-timing-function: ease-out;
    }
    @keyframes burst{
      0%{ transform: translate(-50%, 0) scale(.6); opacity:1; }
      60%{ transform: translate(calc(-50% + var(--dx,0px)), calc(-140% + var(--dy,0px))) scale(1.0); opacity:0.95; }
      100%{ transform: translate(calc(-50% + var(--dx,0px)), calc(-240% + var(--dy,0px))) scale(.9); opacity:0; }
    }

    /* small footer */
    .small{ margin-top:12px; font-size:12px; color:#888; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>hiya! you look adorable today 🥰</h1>
    <p>tiny reminder: you’re doing great. breathe in, breathe out — repeat.</p>

    <button class="btn" id="hugBtn">Send a hug 🤗</button>

    <div class="small">Click the button for a cute heart burst ✨</div>

    <!-- floating hearts layer -->
    <div class="hearts" id="hearts">
      <span class="heart h1" style="--dx: -8px; --dy: 20px;"></span>
      <span class="heart h2" style="--dx: 6px; --dy: -10px;"></span>
      <span class="heart h3" style="--dx: -20px; --dy: -8px;"></span>
      <span class="heart h4" style="--dx: 24px; --dy: 8px;"></span>
      <span class="heart h5" style="--dx: 12px; --dy: 18px;"></span>
    </div>
  </div>

  <script>
    // simple interactivity: toggle a burst class for 900ms to replay animation
    const btn = document.getElementById('hugBtn');
    const hearts = document.getElementById('hearts');
    btn.addEventListener('click', () => {
      hearts.classList.remove('burst');
      // force reflow so the animation can replay
      void hearts.offsetWidth;
      hearts.classList.add('burst');
      // brief button feedback
      btn.textContent = 'Hug sent ❤️';
      setTimeout(() => btn.textContent = 'Send a hug 🤗', 900);
    });
  </script>
</body>
</html>
